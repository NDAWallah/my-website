<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin | NDA Wallah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.msg{margin-top:10px;font-size:.95rem;color:var(--muted)}
.msg.ok{color:var(--army)}
.msg.bad{color:#b3261e}
.lbl{display:grid;gap:6px;color:var(--muted);font-size:.95rem}
.items{list-style:none;margin-top:14px;border-top:1px solid var(--line)}
.items li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.items li button{padding:8px 14px;border:0;border-radius:8px;background:#b3261e;color:#fff;font:600 .9rem "Barlow",system-ui,sans-serif;cursor:pointer}
.items .none{color:var(--muted)}
.items li div{display:flex;gap:8px;flex-shrink:0}
.items li button.edit{background:#1f3c73}
.form .cancel{background:#6b7588}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 16px;color:var(--muted)}
.bar button{padding:8px 14px;border:0;border-radius:8px;background:var(--navy);color:#fff;font:600 .9rem "Barlow",system-ui,sans-serif;cursor:pointer}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="logo.png" alt="NDA Wallah logo" onerror="this.style.display='none'">
    <div><h1>Admin Panel</h1><p>NDA Wallah</p></div>
  </div>
  <div class="stripe" aria-hidden="true"><i></i><i></i><i></i></div>
</header>

<main>
  <a class="back" href="index.html">← Public Home</a>

  <section id="login" class="admin-section">
    <h2>Admin login</h2>
    <form id="loginForm" class="form">
      <input id="email" type="email" required placeholder="Email" autocomplete="username">
      <input id="password" type="password" required placeholder="Password" autocomplete="current-password">
      <button type="submit">Login</button>
    </form>
    <p id="loginMsg" class="msg"></p>
  </section>

  <div id="panel" hidden>
    <div class="bar"><span id="who"></span><button id="logout" type="button">Logout</button></div>
    <div id="sections"></div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey || /^PASTE/.test(cfg.apiKey)) {
    $("loginForm").hidden = true;
    $("loginMsg").textContent = "Pehle firebase-config.js mein apni Firebase details paste karo.";
    return;
  }
  firebase.initializeApp(cfg);
  var auth = firebase.auth();
  var db = firebase.firestore();

  var SECTIONS = [
    { col: "batches", title: "Batches", nameLabel: "Batch name", linkLabel: "Batch link (Telegram etc.)", defText: "Join batch", image: true },
    { col: "books", title: "Books and study material", nameLabel: "Book / material name", linkLabel: "PDF / resource link", defText: "Open", image: true },
    { col: "social", title: "Social links", nameLabel: "Telegram / WhatsApp / Instagram", linkLabel: "https://...", defText: "Join", image: false, linkRequired: true }
  ];

  function explain(err) {
    if (err && err.code === "permission-denied") return "Ye account allowed nahi hai. Firestore rules mein apna email check karo.";
    return "Nahi hua: " + ((err && err.message) || err);
  }

  // Shrinks a phone photo so it stays small (about 50-120 KB) before saving.
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onerror = reject;
      fr.onload = function () {
        var im = new Image();
        im.onerror = reject;
        im.onload = function () {
          var k = Math.min(1, 700 / Math.max(im.width, im.height));
          var c = document.createElement("canvas");
          c.width = Math.round(im.width * k);
          c.height = Math.round(im.height * k);
          var g = c.getContext("2d");
          g.fillStyle = "#fff";
          g.fillRect(0, 0, c.width, c.height);
          g.drawImage(im, 0, 0, c.width, c.height);
          resolve(c.toDataURL("image/jpeg", 0.72));
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  var editing = {};  // section -> id of the item being edited
  var cache = {};    // section -> { id: data }

  function clearEdit(s) {
    var f = $("f-" + s.col);
    delete editing[s.col];
    f.reset();
    f.querySelector('button[type="submit"]').textContent = "Add";
    f.querySelector(".cancel").hidden = true;
  }

  function startEdit(s, id) {
    var f = $("f-" + s.col), msg = $("m-" + s.col), d = cache[s.col][id];
    editing[s.col] = id;
    ["title", "description", "link", "linkText"].forEach(function (n) {
      if (f.elements[n]) f.elements[n].value = d[n] || "";
    });
    if (f.elements.imageUrl) f.elements.imageUrl.value = "";
    if (f.elements.file) f.elements.file.value = "";
    f.querySelector('button[type="submit"]').textContent = "Update";
    f.querySelector(".cancel").hidden = false;
    msg.className = "msg";
    msg.textContent = "Edit mode: badlav karke Update dabao." + (d.image ? " Nayi photo nahi chunoge to purani photo hi rahegi." : "");
    f.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  async function refresh(s) {
    var ul = $("l-" + s.col);
    try {
      var snap = await db.collection(s.col).orderBy("created", "desc").get();
      ul.innerHTML = "";
      cache[s.col] = {};
      if (snap.empty) { ul.innerHTML = '<li class="none">Abhi kuch add nahi hai.</li>'; return; }
      snap.forEach(function (doc) {
        var d = doc.data();
        cache[s.col][doc.id] = d;
        var li = document.createElement("li");
        var t = document.createElement("span");
        t.textContent = d.title || "(no name)";
        var box = document.createElement("div");

        var e = document.createElement("button");
        e.type = "button";
        e.className = "edit";
        e.textContent = "Edit";
        e.onclick = function () { startEdit(s, doc.id); };

        var b = document.createElement("button");
        b.type = "button";
        b.textContent = "Delete";
        b.onclick = async function () {
          if (!confirm("Delete: " + (d.title || "") + " ?")) return;
          try {
            await db.collection(s.col).doc(doc.id).delete();
            if (editing[s.col] === doc.id) clearEdit(s);
          } catch (err) { alert(explain(err)); }
          refresh(s);
        };

        box.appendChild(e);
        box.appendChild(b);
        li.appendChild(t);
        li.appendChild(box);
        ul.appendChild(li);
      });
    } catch (err) {
      ul.innerHTML = '<li class="none">List load nahi hui. Login aur rules check karo.</li>';
    }
  }

  function wire(s) {
    var f = $("f-" + s.col), msg = $("m-" + s.col);
    f.querySelector(".cancel").addEventListener("click", function () {
      clearEdit(s);
      msg.className = "msg";
      msg.textContent = "";
    });
    f.addEventListener("submit", async function (e) {
      e.preventDefault();
      var btn = f.querySelector('button[type="submit"]');
      btn.disabled = true;
      msg.className = "msg";
      msg.textContent = "Saving...";
      try {
        var v = function (n) { return f.elements[n] ? f.elements[n].value.trim() : ""; };
        var data = { title: v("title"), description: v("description"), link: v("link"), linkText: v("linkText") || s.defText };
        var image = v("imageUrl");
        var file = f.elements.file && f.elements.file.files[0];
        if (file) image = await shrink(file);
        if (image) data.image = image;
        var id = editing[s.col];
        if (id) {
          await db.collection(s.col).doc(id).update(data);
          clearEdit(s);
          msg.className = "msg ok";
          msg.textContent = "Update ho gaya.";
        } else {
          data.created = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection(s.col).add(data);
          f.reset();
          msg.className = "msg ok";
          msg.textContent = "Add ho gaya. Site par dikhne lagega.";
        }
        refresh(s);
      } catch (err) {
        msg.className = "msg bad";
        msg.textContent = explain(err);
      }
      btn.disabled = false;
    });
  }

  SECTIONS.forEach(function (s) {
    var sec = document.createElement("section");
    sec.className = "admin-section";
    sec.innerHTML =
      "<h2>" + s.title + "</h2>" +
      '<form class="form" id="f-' + s.col + '">' +
        '<input name="title" required placeholder="' + s.nameLabel + '">' +
        '<input name="description" placeholder="Short description (optional)">' +
        '<input name="link" type="url"' + (s.linkRequired ? " required" : "") + ' placeholder="' + s.linkLabel + '">' +
        '<input name="linkText" placeholder="Button text (default: ' + s.defText + ')">' +
        (s.image
          ? '<label class="lbl">Photo from your phone (optional)<input name="file" type="file" accept="image/*"></label>' +
            '<input name="imageUrl" type="url" placeholder="Or a photo link (optional)">'
          : "") +
        '<button type="submit">Add</button>' +
        '<button type="button" class="cancel" hidden>Cancel edit</button>' +
      "</form>" +
      '<p class="msg" id="m-' + s.col + '"></p>' +
      '<ul class="items" id="l-' + s.col + '"></ul>';
    $("sections").appendChild(sec);
    wire(s);
  });

  $("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    $("loginMsg").className = "msg";
    $("loginMsg").textContent = "Logging in...";
    try {
      await auth.signInWithEmailAndPassword($("email").value.trim(), $("password").value);
      $("loginMsg").textContent = "";
    } catch (err) {
      $("loginMsg").className = "msg bad";
      $("loginMsg").textContent = "Login nahi hua. Email ya password check karo.";
    }
  });
  $("logout").addEventListener("click", function () { auth.signOut(); });

  auth.onAuthStateChanged(function (u) {
    $("login").hidden = !!u;
    $("panel").hidden = !u;
    if (u) {
      $("who").textContent = u.email;
      SECTIONS.forEach(refresh);
    }
  });
})();
</script>
</body>
</html>
